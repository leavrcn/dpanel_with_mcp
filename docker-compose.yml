# DPanel with MCP — Docker Compose 部署示例
#
# 快速开始：
#   cp .env.example .env && 编辑 .env（token/面板密码）
#   docker compose up -d
#
# 说明：
#   - 镜像从 GHCR 拉取（tag 与仓库 Release 一一对应）
#   - MCP 端点：http://<host>:8807/dpanel/mcp（Bearer token 鉴权）
#   - 配置变更（token/profile/开关）需重启容器生效

services:
  dpanel:
    # GHCR 镜像：tag 与 Release 对应（如 1.11.2-mcp）；跟踪最新用 latest
    image: ghcr.io/leavrcn/dpanel:1.11.2-mcp
    container_name: dpanel-with-mcp

    ports:
      # 面板 Web UI + MCP 端点（同一端口）
      # 仅本机访问用 "127.0.0.1:8807:8080"；内网访问用 "8807:8080"
      - "8807:8080"

    environment:
      TZ: Asia/Shanghai

      # ==================== MCP 配置 ====================
      DP_MCP_ENABLE: "true"
      # Bearer token：openssl rand -hex 32 生成，勿提交到 git（走 .env）
      DP_MCP_TOKEN: ${DP_MCP_TOKEN:?请在 .env 中设置 DP_MCP_TOKEN}
      # 能力分级：read-only(45 工具) / read-write(78) / admin(99)
      DP_MCP_PROFILE: ${DP_MCP_PROFILE:-read-write}
      # 回环 service 身份（DPanel 面板账号，MCP 工具用它调面板 API）
      DP_MCP_SERVICE_USERNAME: ${DP_MCP_SERVICE_USERNAME:?请在 .env 中设置}
      DP_MCP_SERVICE_PASSWORD: ${DP_MCP_SERVICE_PASSWORD:?请在 .env 中设置}

    volumes:
      # docker.sock 不加 :ro —— DPanel 面板本身要管理容器（启停/创建/删除）
      - /var/run/docker.sock:/var/run/docker.sock
      # 数据持久化（数据库/配置/证书）
      - dpanel_data:/dpanel

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  dpanel_data:
