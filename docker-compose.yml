# DPanel with MCP — Compose 部署示例
#
# 基于上游官方 compose 模板（dpanel-docs/include/yaml.md），
# 在其基础上叠加 MCP 配置（DP_MCP_* 环境变量）。
#
# 快速开始：
#   cp .env.example .env && 编辑 .env（token/面板账号）
#   docker compose up -d
#
# 说明：
#   - 镜像来自 GHCR，tag 与仓库 Release 一一对应
#   - MCP 端点：http://<host>:8807/dpanel/mcp（Bearer token 鉴权）
#   - MCP 配置变更需重启容器生效

services:
  dpanel:
    # GHCR 镜像（固定版本 tag，与仓库 Release 一一对应；升级时改此 tag）
    image: ghcr.io/leavrcn/dpanel:1.11.4-mcp
    # 修改容器名称后，请同步修改下方 APP_NAME 环境变量
    container_name: dpanel
    restart: always
    ports:
      # 使用 Lite 版时删除 80 及 443 端口映射配置
      - 80:80
      - 443:443
      # 修改 8807 更改面板访问端口（MCP 端点同端口：/dpanel/mcp）
      - 8807:8080
    environment:
      # APP_NAME 必须与 container_name 一致
      - APP_NAME=dpanel
      # 配置面板代理地址
      - HTTP_PROXY=
      - HTTPS_PROXY=
      # 配置面板访问的二级目录
      - DP_SYSTEM_BASEURL=
      # ==================== MCP 配置（本仓新增）====================
      # 启用内置 MCP server（默认关闭）
      - DP_MCP_ENABLE=${DP_MCP_ENABLE:-true}
      # Bearer token（openssl rand -hex 32 生成，走 .env 勿提交 git）
      - DP_MCP_TOKEN=${DP_MCP_TOKEN:?请在 .env 中设置 DP_MCP_TOKEN}
      # 能力分级：read-only(45 工具) / read-write(78) / admin(99)
      - DP_MCP_PROFILE=${DP_MCP_PROFILE:-read-write}
      # 回环 service 身份（DPanel 面板账号，MCP 工具用它调面板 API）
      - DP_MCP_SERVICE_USERNAME=${DP_MCP_SERVICE_USERNAME:?请在 .env 中设置}
      - DP_MCP_SERVICE_PASSWORD=${DP_MCP_SERVICE_PASSWORD:?请在 .env 中设置}
    volumes:
      # windows、macOS 将冒号前更改为 //var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      # 将 /home/dpanel 更改为你想要挂载的宿主机目录，容器内路径为 /dpanel
      - /home/dpanel:/dpanel
      # 可单独绑定面板容器内的 /dpanel/compose；宿主机路径由冒号前的源目录决定
      # - /opt/compose:/dpanel/compose
    extra_hosts:
      - "host.dpanel.local:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "10"
