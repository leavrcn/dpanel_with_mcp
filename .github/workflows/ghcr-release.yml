name: Release (GHCR)

# fork 适配版发布流水线：
# - 只构建 CE lite 镜像（amd64 + arm64），推送到 GHCR（ghcr.io/<owner>/dpanel）
# - 使用内置 GITHUB_TOKEN，无需配置任何 secrets
# - 不构建 pe/xk/synology/darwin，不向上游相关仓库推 tag
# - 上游 release.yml 保留不动（merge upstream 时减少冲突）

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          # v1.11.1-mcp6 -> 1.11.1-mcp6（tag 名去 v 前缀，直接做镜像 tag）
          echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push (CE lite, amd64+arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: lite
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dpanel:${{ steps.tag.outputs.image_tag }}
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.image_tag }}
            APP_FAMILY=ce
          cache-from: type=gha
          cache-to: type=gha,mode=max
