name: Release (GHCR)

# fork 适配版发布流水线：
# - 只构建 CE lite 镜像（amd64 + arm64），推送到 GHCR（ghcr.io/<owner>/dpanel）
# - 使用内置 GITHUB_TOKEN，无需配置任何 secrets
# - 不构建 pe/xk/synology/darwin，不向上游相关仓库推 tag
# - 上游 release.yml 保留不动（merge upstream 时减少冲突）

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dpanel
          tags: |
            # v1.11.2-mcp -> 1.11.2-mcp
            type=semver,pattern={{version}}
            # v1.11.2-mcp -> 1.11
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (CE lite, amd64+arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: lite
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_FAMILY=ce
          cache-from: type=gha
          cache-to: type=gha,mode=max
